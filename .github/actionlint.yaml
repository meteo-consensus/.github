# actionlint configuration (format: docs/config.md of the actionlint v1.7.12 release).
paths:
  .github/workflows/publish.yml:
    ignore:
      # False positive: actionlint v1.7.12 does not know the documented `concurrency.queue`
      # key (docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/
      # control-workflow-concurrency, "queueing multiple pending runs"), which publish.yml
      # uses. Upstream: rhysd/actionlint#657, open on
      # 10/11/2026. Remove this entry once a release accepts the key.
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/release.yml:
    ignore:
      # Same false positive as publish.yml above (rhysd/actionlint#657): release.yml uses
      # `concurrency.queue` since meteo-consensus/.github#14. Remove with the entry above.
      - 'unexpected key "queue" for "concurrency" section'
