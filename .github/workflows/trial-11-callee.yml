# Temporary trial for issue #11, removed before review: does a caller that does not grant
# `packages: write` start a called workflow whose skipped job requests it?
name: Trial 11 callee

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: echo "trial" > trial.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial
          path: trial.txt
          if-no-files-found: error
          retention-days: 1

  fetch:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trial
      - run: cat trial.txt

  gated:
    needs: pack
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - run: echo "should be skipped"
