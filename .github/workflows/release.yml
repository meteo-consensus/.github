# Reusable release: release-please opens or updates the release PR; when it is merged, it
# tags and writes CHANGELOG.md. Publishing lives in `publish.yml`, a separate reusable
# workflow, so that repos which ship no package never grant `packages: write`: GitHub
# refuses to start a called workflow when one of its jobs requests a permission the caller
# does not grant, even if that job's `if` would skip it (trial on real runners, 10/11/2026,
# meteo-consensus/.github#11).
#
# Every repo, package or not:
#
#   jobs:
#     release:
#       uses: meteo-consensus/.github/.github/workflows/release.yml@<sha40> # <version>
#       permissions:
#         contents: write
#         pull-requests: write
#
# Package repos add the `publish` job documented in `publish.yml`, gated on the
# `release_created` output of this workflow.
#
# Note: PRs opened with GITHUB_TOKEN do not trigger other workflows, so the release PR
# gets no CI run. The owner can give release-please a GitHub App token later
# (factory backlog), until then CI runs again on main after the merge.
name: Release

on:
  workflow_call:
    outputs:
      release_created:
        description: "'true' when release-please created a release (tag) in this run."
        value: ${{ jobs.release-please.outputs.release_created }}

permissions: {}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
