# Reusable CI for every TypeScript repo of the org. Callers: `uses:
# meteo-consensus/.github/.github/workflows/node-ci.yml@main` with contents: read and
# packages: read. Actions pinned by full SHA (factory docs/standards.md, 09/11/2026).
#
# Before `pnpm install`, the step "Check pnpm build settings" fails the job when the calling
# repo's pnpm settings open dependency install scripts (meteo-consensus/.github#24), as the
# supply chain rules of meteo-consensus/factory docs/standards.md require: approvals go through
# `allowBuilds` only. It reads pnpm-workspace.yaml, .npmrc and package.json as text, then the
# effective values from `pnpm config get`, and fails on:
# - `dangerouslyAllowAllBuilds` (any value), the `build` capability in `permissions` (any value,
#   `false` included: build decisions go in `allowBuilds`), `strictDepBuilds` false;
# - an `allowBuilds` entry set to true without a non-empty YAML comment on its line or on a
#   comment line just above (the PR mention the rule also requires is checked in review).
#   Entries set to true are written one per line: flow style (`allowBuilds: { a: true }`) is
#   refused for them, even with a comment, since a comment there cannot name one entry;
# - a .pnpmfile.cjs or .pnpmfile.mjs at the root (tracked or not) or tracked anywhere below it,
#   or a `pnpmfile`, `globalPnpmfile`, `configDependencies`, `include` or `lockfileDir` setting
#   (`lockfileDir` makes pnpm load the default pnpmfile of another directory): they load code or
#   settings this check cannot read (a pnpmfile `updateConfig` hook can turn builds on), so they
#   need an owner decision;
# - a top-level line of pnpm-workspace.yaml that the text scan cannot read as a plain key
#   (complex `?` or flow key, escape in a quoted key, `<<` merge key), so no key is skipped;
# - the pre-pnpm 11 keys `onlyBuiltDependencies`, `onlyBuiltDependenciesFile`,
#   `neverBuiltDependencies`, `ignoredBuiltDependencies`, in pnpm-workspace.yaml or in the `pnpm`
#   field of package.json (pnpm 11 and later ignore them silently);
# - a pnpm older than 12.11.0 (the first with `permissions`), or any `pnpm config get` that
#   fails or prints nothing (fail closed).
# YAML booleans are read as pnpm 12.17.0 reads them: true, yes, y, on and false, no, n, off, in
# any case. The step runs no script of the calling repo and no dependency, but `pnpm --version`
# and `pnpm config get` download and run the pnpm version the caller pins in `packageManager`.
# Settings passed through `npm_config_*` variables or the runner's global configuration are out
# of its scope.
name: Node CI

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          # Writes a user-level .npmrc reading NODE_AUTH_TOKEN (pnpm ignores project-level tokens).
          registry-url: https://npm.pkg.github.com
          scope: "@meteo-consensus"
      # Runs before Install, as described in the header. `pnpm config get` reads the settings only
      # (checked with pnpm 12.17.0 on 12/11/2026: it neither loads .pnpmfile.cjs nor installs
      # configDependencies). No secret. Tested on the example repos of tests/pnpm-build-settings
      # (workflow test-workflows.yml).
      - name: Check pnpm build settings
        run: |
          set -euo pipefail
          ws=pnpm-workspace.yaml
          rc=.npmrc
          pj=package.json
          rules="meteo-consensus/factory docs/standards.md, supply chain rules"
          policy="Approve each package in allowBuilds instead; anything else needs an owner decision ($rules)."
          daab="it lets every dependency that is not denied run its install scripts. $policy"
          strict="an unapproved dependency build no longer fails the install; remove the setting (pnpm defaults to true). $policy"
          perm="which outranks allowBuilds. $policy"
          code="it makes pnpm load code or settings this check cannot read (a pnpmfile updateConfig hook can turn dependency builds on), so it needs an owner decision ($rules)."
          legacy="pnpm 11 and later ignore it silently; approvals go in allowBuilds ($rules)."
          need="A true entry needs both: a non-empty YAML comment on its line or on the line just above giving the reason (checked here), and a mention in the pull request (checked in review). See $rules."
          failed=0
          static_true=0

          annotate() { # <file or empty> <line or empty> <message>
            local where=""
            if [ -n "$1" ]; then where=" file=$1${2:+,line=$2}"; fi
            printf '::error%s::%s\n' "$where" "${3//%/%25}"
            failed=1
          }

          lib='
          function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }
          function err(msg) { print "ERR\t" NR "\t" msg }
          # YAML booleans as pnpm 12.17.0 reads them (yes, y and on are true; no, n and off false).
          function truthy(v) { v = tolower(v); return v == "true" || v == "yes" || v == "y" || v == "on" }
          function falsy(v) { v = tolower(v); return v == "false" || v == "no" || v == "n" || v == "off" }
          # Splits "key: value # comment" into K, V and C (comment text, HASC if a # is there).
          function entry(s,   q, i, rest) {
            s = trim(s); K = ""; V = ""; C = ""; HASC = 0; q = substr(s, 1, 1)
            if (q == "\"" || q == sq) {
              i = index(substr(s, 2), q); if (i == 0) return 0
              K = substr(s, 2, i - 1); rest = substr(s, i + 2)
              if (rest !~ /^[ \t]*:/) return 0
              sub(/^[ \t]*:/, "", rest)
            } else {
              if (!match(s, /:([ \t]|$)/)) return 0
              K = substr(s, 1, RSTART - 1); rest = substr(s, RSTART + 1)
            }
            if (match(rest, /(^|[ \t])#/)) {
              HASC = 1; C = trim(substr(rest, RSTART + RLENGTH)); rest = substr(rest, 1, RSTART - 1)
            }
            V = trim(rest); return 1
          }
          { sub(/\r$/, "") }
          '

          scan() { # <file> <awk program>: annotates its errors, counts the allowBuilds true entries
            local out kind line text
            out=$(awk -v sq="'" -v daab="$daab" -v strict="$strict" -v perm="$perm" -v code="$code" \
              -v legacy="$legacy" -v need="$need" -v rules="$rules" "$lib$2" "$1")
            while IFS=$'\t' read -r kind line text; do
              case $kind in
                ERR) annotate "$1" "$line" "$text" ;;
                TRUE) static_true=$((static_true + 1)) ;;
              esac
            done <<<"$out"
          }

          if [ -f "$ws" ]; then
            # The awk program is single-quoted on purpose: its $0 is awk's, not the shell's.
            # shellcheck disable=SC2016
            scan "$ws" '
            BEGIN {
              build = "(^|[{, \t])[\"" sq "]?build[\"" sq "]?[ \t]*:"
              flowtrue = ":[ \t]*(true|yes|y|on)[ \t]*([,}]|$)"
              split("pnpmfile globalPnpmfile configDependencies include lockfileDir", a); for (i in a) loads[a[i]] = 1
              split("onlyBuiltDependencies onlyBuiltDependenciesFile neverBuiltDependencies ignoredBuiltDependencies", a)
              for (i in a) old[a[i]] = 1
            }
            /^[ \t]*$/ { prevc = 0; next }
            /^[ \t]*#/ { prevc = ($0 ~ /^[ \t]*#[ \t]*[^ \t]/); next }
            /^[^ \t]/ {
              section = ""; inner = -1; prevc = 0
              if ($0 ~ /^(---|\.\.\.)([ \t]|$)/ || $0 ~ /^%/) next
              # A key this scan cannot read (complex or flow key, escape, merge key) could hide
              # any setting: refuse it rather than skip it.
              if ($0 ~ /^[?{]/ || substr($0, 1, 1) == "[" || !entry($0) || index(K, "\\") || K == "<<") {
                err("top-level line the check cannot read as a plain key: write each setting as name: value (" rules ").")
                next
              }
              section = K
              if (K == "dangerouslyAllowAllBuilds") err(K " is set (value: " V "): " daab)
              if (K == "strictDepBuilds" && falsy(V)) err(K " is false (value: " V "): " strict)
              if (K == "permissions" && V ~ build) err("permissions sets the build capability (any value), " perm)
              if (K == "allowBuilds" && tolower(V) ~ flowtrue)
                err("allowBuilds is written in flow style with a true entry: write each true entry on its own line. " need)
              if (K in loads) err(K " is set: " code)
              if (K in old) err(K " is set: " legacy)
              next
            }
            {
              match($0, /^[ \t]*/); ind = RLENGTH; if (inner < 0) inner = ind
              if (section == "permissions" && entry($0)) {
                if (ind == inner) pkg = K
                if (ind > inner ? (K == "build") : (V ~ build))
                  err("permissions sets the build capability for " pkg " (" (ind > inner ? "build: " V : V) "; any value is refused), " perm)
              }
              if (section == "allowBuilds" && ind == inner && entry($0) && truthy(V)) {
                print "TRUE\t" NR "\t" K
                if (!(HASC && C != "") && !prevc)
                  err("allowBuilds entry \"" K "\" is true without a justification comment. " need)
              }
              prevc = 0
            }'
          fi

          if [ -f "$rc" ]; then
            # The awk program is single-quoted on purpose: its $0 is awk's, not the shell's.
            # shellcheck disable=SC2016
            scan "$rc" '
            /^[ \t]*([#;]|$)/ { next }
            {
              i = index($0, "="); key = trim(i ? substr($0, 1, i - 1) : $0); val = trim(i ? substr($0, i + 1) : "")
              k = tolower(key)
              if (k == "dangerously-allow-all-builds" || k == "dangerouslyallowallbuilds") err(key " is set (value: " val "): " daab)
              else if ((k == "strict-dep-builds" || k == "strictdepbuilds") && falsy(val)) err(key " is false (value: " val "): " strict)
              else if (k ~ /^permissions/ && $0 ~ /build/) err("permissions sets the build capability (any value), " perm)
            }'
          fi

          # Pnpmfiles are never run nor read here: their presence alone needs an owner decision.
          # At the root, any file (tracked or not); below it, any tracked one, since settings such
          # as lockfileDir make pnpm load the default pnpmfile of another directory.
          for f in .pnpmfile.cjs .pnpmfile.mjs; do
            if [ -e "$f" ] || [ -L "$f" ]; then annotate "$f" "" "$f exists: $code"; fi
          done
          if ! nested=$(git ls-files -z -- ':(glob)**/.pnpmfile.cjs' ':(glob)**/.pnpmfile.mjs' | tr '\0' '\n'); then
            annotate "" "" "git ls-files failed: the pnpmfiles of the repo cannot be listed, so the check fails."
            nested=""
          fi
          while IFS= read -r f; do
            if [[ "$f" == */* ]]; then annotate "$f" "" "$f exists: $code"; fi
          done <<<"$nested"

          if [ -f "$pj" ]; then
            if ! old=$(jq -r '.pnpm | objects | keys[] | select(IN("onlyBuiltDependencies",
              "onlyBuiltDependenciesFile", "neverBuiltDependencies", "ignoredBuiltDependencies"))' "$pj"); then
              annotate "$pj" "" "package.json is not valid JSON: its pnpm field cannot be checked."
              old=""
            fi
            while IFS= read -r key; do
              key=${key%$'\r'}
              if [ -n "$key" ]; then annotate "$pj" "" "pnpm.$key is set: $legacy"; fi
            done <<<"$old"
          fi

          # The rules hold from pnpm 12.11.0 (permissions). `pnpm --version` runs the version the
          # caller pins in packageManager, which is the one the install will run.
          version=$(pnpm --version </dev/null | tail -n 1) || version=""
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\. ]] ||
            ((BASH_REMATCH[1] < 12 || (BASH_REMATCH[1] == 12 && BASH_REMATCH[2] < 11))); then
            pinned=""
            if [ -f "$pj" ]; then pinned=$pj; fi
            annotate "$pinned" "" "pnpm ${version:-(no version reported)} runs here (the packageManager field of package.json picks it): these rules need pnpm 12.11.0 or later, the first with the permissions setting. Pin pnpm 12.11.0 or later; the effective values were not checked ($rules)."
            exit 1
          fi

          # Effective values, as pnpm will read them for the install. Fails closed: an error, no
          # output or an output jq cannot read fails the check.
          where=""
          if [ -f "$ws" ]; then where=$ws; elif [ -f "$rc" ]; then where=$rc; fi
          effective() { # <setting> <jq expression yielding true or false> <message if true>
            local value verdict=""
            if value=$(pnpm config get "$1" --json </dev/null); then
              verdict=$(jq -r "$2" <<<"$value") || verdict=""
            fi
            case $verdict in
              true) annotate "$where" "" "effective value of $1 $3" ;;
              false) ;;
              *) annotate "$where" "" "pnpm config get $1 failed or printed nothing: the effective value cannot be checked, so the check fails." ;;
            esac
          }
          set_value='. != null and . != "" and . != [] and . != {}'
          effective dangerouslyAllowAllBuilds '. == true' "is true (pnpm config get): $daab"
          effective strictDepBuilds '. == false' "is false (pnpm config get): $strict"
          effective permissions '[.[]? | objects | select(has("build"))] | length > 0' \
            "sets the build capability (pnpm config get; any value is refused), $perm"
          effective allowBuilds "[.[]? | select(. == true)] | length > $static_true" \
            "has more true entries (pnpm config get) than the $static_true written one per line in $ws, where this check reads their comment. $need"
          for setting in pnpmfile globalPnpmfile configDependencies include lockfileDir; do
            effective "$setting" "$set_value" "is set (pnpm config get): $code"
          done

          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "pnpm build settings: no setting opens dependency install scripts."
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint and format
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test with coverage
        run: pnpm run test:coverage
      - name: Audit
        run: pnpm run audit

  # Public repos only (meteo-consensus/.github#1): on private repos the dependency review
  # action needs GitHub Code Security or GitHub Advanced Security
  # (docs.github.com/en/code-security/concepts/supply-chain-security/about-dependency-review,
  # checked 09/11/2026), so the job is skipped there and `pnpm audit` (job `check`) is their
  # dependency gate. In a `workflow_call`, the `github` context is the
  # caller's (docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations,
  # checked 09/11/2026), so `private` is the calling repo's visibility.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Single required check for the main ruleset ("ci / CI" in callers).
  gate:
    name: CI
    if: always()
    needs: [check, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "::error::a required job ended with: $result"
              exit 1
            fi
          done
