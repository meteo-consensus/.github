# Temporary trial for issue #13, removed before review: runs the exact check, extract and
# rebuild script of publish.yml (extracted from the file at this commit) against a real
# pnpm pack tarball, tarballs with setuid, setgid, sticky, world-writable and owner-only
# modes, a hard link, an unreadable folder and earlier bad cases, under the runner's umask
# and under umask 0000. No token is used: `permissions` only allows reading this repository.
name: Trial 13 modes

on:
  push:
    branches: [ci/13-publish-normalize-modes]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Tools and options used by publish.yml
        run: |
          echo "image: $ImageOS $ImageVersion; umask: $(umask)"
          tar --version | head -n 1
          chmod --version | head -n 1
          find --version | head -n 1
          chmod --help
          find --help | grep -E -- '-links|-quit|-print ' || true
          tar --help | grep -E -- '--no-same-permissions|-v, --verbose' || true
          man find 2>/dev/null | grep -A4 -E '^ +-links' || echo "man find: not available"
      - name: find -links and chmod behaviour on plain files
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/probe"; mkdir -p "$d/dir"
          echo a > "$d/one"; echo b > "$d/two"; ln "$d/two" "$d/two-link"
          echo "files with more than one link: $(find "$d" -type f -links +1 | sort | xargs -n1 basename | tr '\n' ' ')"
          chmod 4755 "$d/one"; chmod 2777 "$d/dir"; chmod 1666 "$d/two"
          find "$d" -printf 'before %m %P\n' | sort
          chmod -R u=rwX,go=rX,a-st "$d"
          find "$d" -printf 'after  %m %P\n' | sort
          chmod 2777 "$d/dir"; chmod -R u=rwX,go=rX "$d/dir"
          echo "dir with 2777 after u=rwX,go=rX only (no a-st): $(stat -c %a "$d/dir")"
      - name: Extract the script from publish.yml
        run: |
          set -euo pipefail
          awk '/- name: Check, extract and rebuild the tarball/{step=1} step && /^          set -euo pipefail$/{on=1} on{print substr($0, 11)} on && /^          echo "Publishing \$expected"$/{exit}' \
            src/.github/workflows/publish.yml > "$RUNNER_TEMP/check.sh"
          echo "lines: $(wc -l < "$RUNNER_TEMP/check.sh")"
          head -n 3 "$RUNNER_TEMP/check.sh"; tail -n 1 "$RUNNER_TEMP/check.sh"
          # Variant without the listing type check, to show the hard link barrier on its own.
          awk '/^if grep -qv .\^\[-d\]\$. "\$types"; then$/{skip=1} !skip{print} skip && /^fi$/{skip=0}' \
            "$RUNNER_TEMP/check.sh" > "$RUNNER_TEMP/check-no-listing.sh"
          diff "$RUNNER_TEMP/check.sh" "$RUNNER_TEMP/check-no-listing.sh" || true
          [ "$(( $(wc -l < "$RUNNER_TEMP/check.sh") - $(wc -l < "$RUNNER_TEMP/check-no-listing.sh") ))" = 3 ]
          # Variant without the chmod, to show the check on the rebuilt archive's modes.
          grep -v '^chmod -R ' "$RUNNER_TEMP/check.sh" > "$RUNNER_TEMP/check-no-chmod.sh"
          diff "$RUNNER_TEMP/check.sh" "$RUNNER_TEMP/check-no-chmod.sh" || true
          [ "$(( $(wc -l < "$RUNNER_TEMP/check.sh") - $(wc -l < "$RUNNER_TEMP/check-no-chmod.sh") ))" = 1 ]
      - name: Build the cases
        run: |
          set -euo pipefail
          mkdir -p cases/real && cd cases/real
          echo '{"name":"@meteo-consensus/trial","version":"0.0.1","bin":{"trial":"bin/cli.js"},"files":["index.js","lib","bin"]}' > package.json
          echo 'export const a = 1;' > index.js
          mkdir lib bin && echo 'export const b = 2;' > lib/b.js
          printf '#!/usr/bin/env node\nconsole.log(1)\n' > bin/cli.js && chmod +x bin/cli.js
          pnpm pack --out ../real.tgz
          cd ..
          python3 - <<'PY'
          import io, tarfile, json, gzip
          good = json.dumps({"name": "@meteo-consensus/trial", "version": "0.0.1"}).encode()
          evil = json.dumps({"name": "@meteo-consensus/evil", "version": "6.6.6"}).encode()
          def member(name, data):
              i = tarfile.TarInfo(name); i.size = len(data)
              buf = i.tobuf(format=tarfile.USTAR_FORMAT)
              return buf + data + b"\0" * ((512 - len(data) % 512) % 512)
          def d(t, name, mode):
              i = tarfile.TarInfo(name); i.type = tarfile.DIRTYPE; i.mode = mode; t.addfile(i)
          def f(t, name, data, mode=0o644):
              i = tarfile.TarInfo(name); i.size = len(data); i.mode = mode; t.addfile(i, io.BytesIO(data))
          def link(t, name, target, kind):
              i = tarfile.TarInfo(name); i.type = kind; i.linkname = target; t.addfile(i)
          raw = member("package/package.json", good) + b"\0" * 512 + member("evil/package.json", evil) + b"\0" * 1024
          with open("lone-zero.tgz", "wb") as out:
              out.write(gzip.compress(raw))
          def setuid(t):
              d(t, "package/", 0o755); f(t, "package/package.json", good)
              d(t, "package/bin/", 0o6755)
              f(t, "package/bin/cli.js", b"#!/usr/bin/env node\n", 0o4755)
              f(t, "package/bin/gid.js", b"x", 0o2755)
          def world_writable(t):
              d(t, "package/", 0o777); f(t, "package/package.json", good, 0o666)
              d(t, "package/lib/", 0o1777)
              f(t, "package/lib/w.js", b"x", 0o666)
              f(t, "package/lib/x.js", b"x", 0o777)
              f(t, "package/lib/s.js", b"x", 0o1644)
          def owner_only(t):
              d(t, "package/", 0o700); f(t, "package/package.json", good, 0o600)
              d(t, "package/lib/", 0o700)
              f(t, "package/lib/r.js", b"x", 0o400)
              f(t, "package/lib/o.js", b"x", 0o100)
          def unreadable_dir(t):
              d(t, "package/", 0o755); f(t, "package/package.json", good)
              d(t, "package/lib/", 0o000); f(t, "package/lib/b.js", b"x")
          cases = {
              "setuid": setuid,
              "world-writable": world_writable,
              "owner-only": owner_only,
              "unreadable-dir": unreadable_dir,
              "hard-link": lambda t: (f(t, "package/package.json", good), f(t, "package/a.js", b"x"), link(t, "package/b.js", "package/a.js", tarfile.LNKTYPE)),
              "two-roots": lambda t: (f(t, "package/package.json", good), f(t, "evil/package.json", evil)),
              "symlink": lambda t: (f(t, "package/package.json", good), link(t, "package/x.js", "/etc/passwd", tarfile.SYMTYPE)),
              "wrong-version": lambda t: f(t, "package/package.json", evil.replace(b"evil", b"trial")),
          }
          for name, build in cases.items():
              with tarfile.open(f"{name}.tgz", "w:gz", format=tarfile.GNU_FORMAT) as t:
                  build(t)
          PY
          cp real.tgz sha-mismatch.tgz
          for c in *.tgz; do echo "-- $c as packed:"; tar -tvzf "$c"; done
      - name: Run the script on every case, under the runner's umask and umask 0000
        run: |
          echo '{"name":"@meteo-consensus/trial","version":"0.0.1","private":true}' > trusted.json
          # Expected rebuilt archive (mode and path) for the cases that must pass.
          expect() {
            case "$1" in
              real) printf '%s\n' 'drwxr-xr-x package/' 'drwxr-xr-x package/bin/' '-rwxr-xr-x package/bin/cli.js' '-rw-r--r-- package/index.js' 'drwxr-xr-x package/lib/' '-rw-r--r-- package/lib/b.js' '-rw-r--r-- package/package.json' ;;
              setuid) printf '%s\n' 'drwxr-xr-x package/' 'drwxr-xr-x package/bin/' '-rwxr-xr-x package/bin/cli.js' '-rwxr-xr-x package/bin/gid.js' '-rw-r--r-- package/package.json' ;;
              world-writable) printf '%s\n' 'drwxr-xr-x package/' 'drwxr-xr-x package/lib/' '-rw-r--r-- package/lib/s.js' '-rw-r--r-- package/lib/w.js' '-rwxr-xr-x package/lib/x.js' '-rw-r--r-- package/package.json' ;;
              owner-only) printf '%s\n' 'drwxr-xr-x package/' 'drwxr-xr-x package/lib/' '-rwxr-xr-x package/lib/o.js' '-rw-r--r-- package/lib/r.js' '-rw-r--r-- package/package.json' ;;
              lone-zero) printf '%s\n' 'drwxr-xr-x package/' '-rw-r--r-- package/package.json' ;;
            esac
          }
          status=0
          run_case() { # script, case, umask, wanted result
            local script="$1" c="$2" mask="$3" want="$4" result
            local dir
            dir="$RUNNER_TEMP/run-$c-$mask-$(basename "$script" .sh)"
            mkdir -p "$dir/temp"; cp "cases/$c.tgz" "$dir/package.tgz"; cp trusted.json "$dir/package.json"
            local sha; sha="$(sha256sum "cases/$c.tgz" | cut -c1-64)"
            [ "$c" = sha-mismatch ] && sha="$(printf '%064d' 0)"
            if (cd "$dir" && umask "$mask" && RUNNER_TEMP="$dir/temp" EXPECTED_SHA256="$sha" bash "$script" > out.txt 2>&1); then result=pass; else result=fail; fi
            echo "== $c, umask $mask, $(basename "$script"): $result"
            sed 's/::/:<colons>:/g' "$dir/out.txt"
            if [ "$result" != "$want" ]; then echo "UNEXPECTED for $c: wanted $want"; status=1; fi
            if [ "$result" = pass ]; then
              local got; got="$(tar -tvzf "$dir/temp/rebuilt/package.tgz" | awk '{print $1, $6}')"
              echo "-- rebuilt archive:"; tar -tvzf "$dir/temp/rebuilt/package.tgz"
              if [ "$got" != "$(expect "$c")" ]; then echo "UNEXPECTED rebuilt modes for $c"; status=1; fi
            fi
          }
          for mask in 0022 0000; do
            for c in real setuid world-writable owner-only lone-zero; do run_case "$RUNNER_TEMP/check.sh" "$c" "$mask" pass; done
            for c in hard-link unreadable-dir two-roots symlink wrong-version sha-mismatch; do run_case "$RUNNER_TEMP/check.sh" "$c" "$mask" fail; done
            run_case "$RUNNER_TEMP/check-no-listing.sh" hard-link "$mask" fail
            grep -q 'more than one hard link' "$RUNNER_TEMP/run-hard-link-$mask-check-no-listing/out.txt" \
              || { echo "UNEXPECTED: the hard link barrier did not fire on its own"; status=1; }
          done
          for c in world-writable owner-only; do
            run_case "$RUNNER_TEMP/check-no-chmod.sh" "$c" 0000 fail
            grep -q 'a mode other than 0755 or 0644' "$RUNNER_TEMP/run-$c-0000-check-no-chmod/out.txt" \
              || { echo "UNEXPECTED: the rebuilt modes check did not fire for $c"; status=1; }
          done
          run_case "$RUNNER_TEMP/check-no-chmod.sh" real 0022 pass
          exit "$status"
      - name: Modes GNU tar extracts before normalization (umask 0000)
        if: always()
        run: |
          for c in setuid world-writable owner-only hard-link; do
            x="$RUNNER_TEMP/raw-$c"; mkdir -p "$x"
            (umask 0000 && tar -xzf "cases/$c.tgz" -C "$x" --no-same-owner --no-same-permissions) || true
            echo "-- $c"; find "$x" -mindepth 1 -printf '%m links=%n %P\n' | sort -k3
          done
      - name: The rebuilt real tarball installs with its bin executable
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/consumer"; mkdir -p "$p"; echo '{"name":"consumer","private":true}' > "$p/package.json"
          (cd "$p" && pnpm add "$RUNNER_TEMP/run-real-0022-check/temp/rebuilt/package.tgz" --ignore-scripts > add.log 2>&1) || { tail -n 5 "$p/add.log"; exit 1; }
          ls -lL "$p/node_modules/@meteo-consensus/trial/bin/cli.js"
          [ -x "$p/node_modules/@meteo-consensus/trial/bin/cli.js" ]
