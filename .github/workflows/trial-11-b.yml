# Temporary trial for issue #11, removed before review: startup validation of the final files.
name: Trial 11 B (package)
on:
  push:
    branches: [ci/11-release-least-privilege]
permissions: {}
jobs:
  release:
    if: false
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
