# Reusable publish to GitHub Packages, for repos that ship an npm package (contracts, db).
# Called after `release.yml`, only when it created a release:
#
#   jobs:
#     release:
#       uses: meteo-consensus/.github/.github/workflows/release.yml@<sha40> # <version>
#       permissions:
#         contents: write
#         pull-requests: write
#     publish:
#       needs: release
#       if: needs.release.outputs.release_created == 'true'
#       uses: meteo-consensus/.github/.github/workflows/publish.yml@<sha40> # <version>
#       permissions:
#         contents: read
#         packages: write
#
# Least privilege (meteo-consensus/.github#11): the GITHUB_TOKEN carries the permissions
# of the whole job, so no job that installs or runs dependency code holds `packages: write`.
# - `build` installs with `--ignore-scripts` and a token limited to `packages: read`, runs
#   the checks, packs the tarball (the package's own `prepack` builds it) and uploads it.
# - `publish` holds `packages: write` but installs nothing: it checks out only
#   `package.json` and `.node-version` (to set up pnpm and Node.js), downloads the tarball,
#   fails unless it has a single `package/` root of regular files and directories with one
#   `package/package.json` whose `name` and `version` are those of the checked-out
#   `package.json`, and publishes it with `--ignore-scripts`. Only that last step receives
#   NODE_AUTH_TOKEN.
# Dependency code (run by `pnpm run check` and `prepack` in `build`) never holds a token
# that can publish and cannot choose the published name or version, but it can still alter
# the built code inside the legitimate version: residual risk, only a reproducible build or
# provenance would close it.
#
# Recovery: the tarball is kept 7 days, so a failed `publish` job can be re-run alone from
# the run page within that window; after it, re-run the `build` job, which re-runs `publish`.
name: Publish

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Writes a user-level .npmrc reading NODE_AUTH_TOKEN (pnpm ignores project-level tokens).
          registry-url: https://npm.pkg.github.com
          scope: "@meteo-consensus"
      - name: Install (no dependency scripts, read-only token)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: pnpm run check
      - name: Pack
        run: pnpm pack --out package.tgz
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-package-tarball-${{ github.run_attempt }}
          path: package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /package.json
            /.node-version
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@meteo-consensus"
      # The exact artifact `build` uploaded, by id. A re-run of `publish` alone keeps the
      # previous `build` outputs; a re-run of `build` uploads under a new name (per attempt)
      # because, in a trial on runners (meteo-consensus/.github#11), a second artifact with
      # the same name in the same run was neither returned by name nor found by id.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
      # jq and tar ship with the ubuntu-latest image (checked on runners, see
      # meteo-consensus/.github#11); nothing is installed here.
      # Structure first, fail closed: npm reads a tarball manifest with the first path
      # segment stripped, so a second root (`evil/package.json`) would pass a check of
      # `package/package.json` alone. Nothing read from the tarball is printed (no workflow
      # command injection): only the trusted expected value and a hash of the manifest.
      - name: Check the tarball is the checked-out package and version
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          entries="$RUNNER_TEMP/tarball-entries.txt"
          tar -tzf package.tgz > "$entries"
          [ -s "$entries" ] || fail "the tarball is empty"
          if grep -qvE '^package(/[^/]+)*/?$' "$entries"; then
            fail "the tarball has an entry outside package/ or an empty path segment"
          fi
          if grep -qE '(^|/)\.\.?(/|$)' "$entries"; then
            fail "the tarball has a '.' or '..' path segment"
          fi
          manifests="$(grep -cxF 'package/package.json' "$entries" || true)"
          [ "$manifests" = 1 ] || fail "the tarball must hold exactly one package/package.json"
          # Listed to a file first: `grep -q` closing a pipe early would let pipefail turn a
          # match into a non-match.
          types="$RUNNER_TEMP/tarball-types.txt"
          tar -tvzf package.tgz | cut -c1 > "$types"
          if grep -qv '^[-d]$' "$types"; then
            fail "the tarball has an entry that is not a regular file or a directory"
          fi
          expected="$(jq -r '.name + "@" + .version' package.json)"
          manifest="$RUNNER_TEMP/tarball-manifest.json"
          tar -xzOf package.tgz package/package.json > "$manifest"
          actual="$(jq -r '.name + "@" + .version' "$manifest")"
          if [ "$actual" != "$expected" ]; then
            fail "tarball manifest (sha256 $(sha256sum "$manifest" | cut -c1-64)) is not $expected"
          fi
          echo "Publishing $expected"
      - name: Publish the tarball (no scripts)
        run: pnpm publish ./package.tgz --ignore-scripts --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
